# backend for SDE
replicaCount: 1

sdepostgresql:
  # -- PostgreSQL chart configuration
  # Switch to enable or disable the PostgreSQL helm chart
  image:
    # -- PostgreSQL image registry
    registry: docker.io
    # -- PostgreSQL image repository
    repository: postgres
  enabled: true
  fullnameOverride: "product-sde-postgres"
  auth:
    postgresPassword: ""
    username: "sdeuser"
    password: "password"
    database: "sdedb"
    port: 5432
    existingSecret: ""

backend:
  image:
    repository: harbor-hub-shared.arena.3ascloud.de/arena2036/managed-simple-data-exchanger-backend
    pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
    tag: latest

  imagePullSecrets:
    - name: registry-creds

  nameOverride: ""

  fullnameOverride: ""
  portContainer: 8080

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1001

  service:
    type: ClusterIP
    port: 7070
    targetPort: 8080

  backend:
    endpoints:
    ## Default api exposing health checks etc
      default:
    # -- The network port, which the "default" api is going to be exposed by the container, pod and service
        port: 7070
    # -- The path mapping the "default" api is going to be exposed at
        path: /
      # api:
      #   port: "8080"
      #   path: /api
  ingresses:
    - enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://*tx.test"
        nginx.ingress.kubernetes.io/enable-cors: "true"
      hostname: "sde-backend.staging.arena2036-x.de"
      endpoints:
        - default
      tls:
        enabled: true
        secretName: "sde-backend-tls"
      # -- If present overwrites the default secret name
      certManager:
        # -- If preset enables certificate generation via cert-manager namespace scoped issuer
        # issuer: ""
        # -- If preset enables certificate generation via cert-manager cluster-wide issuer
        clusterIssuer: "letsencrypt-staging"
      # hosts:
      #   - chart-example.local

  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 600m
      memory: 2Gi
    requests:
      cpu: 600m
      memory: 2Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  configuration:
    properties: |-
      keycloak.clientid=SDE-2
      spring.security.oauth2.resourceserver.jwt.issuer-uri=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central
      # Enable multipart uploads
      spring.servlet.multipart.enabled=true
      spring.main.allow-bean-definition-overriding=true
      spring.jackson.mapper.accept-case-insensitive-enums=true
      # Threshold after which files are written to disk.
      spring.servlet.multipart.file-size-threshold=2KB   
      # Max file size.
      spring.servlet.multipart.max-file-size=200MB
      # Max Request Size
      spring.servlet.multipart.max-request-size=215MB
      server.servlet.context-path=/api
      ## Flyway
      spring.flyway.baseline-on-migrate=true
      spring.flyway.locations=classpath:/flyway
      ## Database
      spring.datasource.driver-class-name=org.postgresql.Driver
      spring.jpa.hibernate.ddl-auto=update
      #spring.jpa.hibernate.ddl-auto=create
      spring.datasource.url=jdbc:postgresql://localhost:5432/sdedb
      spring.datasource.username=postgres
      spring.datasource.password=admin
      spring.jpa.open-in-view=false
      ## File Storage Properties
      file.upload-dir=./temp/
      ## Logging
      logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%logger{36}] - %msg%n
      logging.level.root=DEBUG
      logging.level.org.springframework.web=WARN
      logging.level.org.apache.http=DEBUG
      logging.level.sun.rmi=WARN
      logging.level.javax.management.remote.rmi=WARN
      logging.level.com.zaxxer.hikari=WARN
      logging.level.org.springframework.cloud.openfeign=DEBUG
      #feign.client.config.digitalTwinsFeignClient.loggerLevel=DEBUG
      ## Digital Twins
      digital-twins.hostname=https://connector-2-dtr.txcd.arena2036.app/semantics/registry
      digital-twins.registry.uri=/api/v3
      digital-twins.registry.lookup.uri=/api/v3
      digital-twins.authentication.enable=false
      #digital-twins.authentication.url=https://centralidp.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token
      digital-twins.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token
      digital-twins.authentication.clientId=satest01
      digital-twins.authentication.clientSecret=UbfW4CR1xH4OskkovqJ2JzcwnQIrG7oj
      digital-twins.authentication.grantType=client_credentials
      digital-twins.authentication.scope=
      #General EDC Configutation
      edc.version.major=0
      edc.version.minor=11
      edc.version.nano=1
      edc.asset.prop.common.version=3.0
      ## EDC Provider
      edc.hostname=https://connector-2-controlplane.txcd.arena2036.app
      edc.managementpath=/management
      edc.apiKeyHeader=X-Api-Key
      edc.apiKey=CONNECTOR2
      edc.dsp.endpointpath=/api/v1/dsp
      edc.dataplane.hostname=https://connector-2-dataplane.txcd.arena2036.app
      edc.dataplane.endpointpath=/api/public
      edc.managementpath.apiversion=/v3
      edc.managementpath.apiversion.asset=/v3
      ## needs to be empty because cx-policy context is causing issues
      edc.policy.prefix=https://w3id.org/catenax/2025/9/policy/
      ## EDC Consumer
      edc.consumer.hostname=https://connector-3-controlplane.txcd.arena2036.app
      edc.consumer.apikeyheader=X-Api-Key
      edc.consumer.apikey=CONNECTOR3
      ##edc.consumer.managementpath=/data/v2
      edc.consumer.managementpath=/management
      edc.consumer.protocol.path=/api/v1/dsp
      ## Submodel data source configuration for EDC
      ##rename to submodel.datasource.external
      submodel.datasource.enable=true
      submodel.datasource.hostname=https://connector-2-submodelserver.txcd.arena2036.app
      submodel.datasource.authentication.enable=false
      submodel.datasource.clientId=sa-cl22-01
      submodel.datasource.clientSecret=changeme
      submodel.datasource.grantType=client_credentials
      #EDR Configuration
      edr.retry.count=5
      edr.retry.time=1500
      edr.refresh.auto=true
      edr.refresh.enable=false
      ## Manufacturer Id
      manufacturerId=BPNL00000000052O
      ##Partner Pool Api Host
      partner.pool.hostname=default
      partner.pool.authentication.url=default
      partner.pool.clientId=default
      partner.pool.clientSecret=default
      partner.pool.grantType=client_credentials
      #BPDM
      bpdm.provider.edc.dsp.api=https://connector-2-controlplane.txcd.arena2036.app
      bpdm.provider.bpnl=BPNL00000000052O
      #bpdm.provider.edc.public.api==
      ## Portal backend and Connector discovery
      portal.backend.hostname=https://portal-backend.txcd.arena2036-x.de
      portal.backend.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token
      portal.backend.clientId=satest01
      portal.backend.clientSecret=UbfW4CR1xH4OskkovqJ2JzcwnQIrG7oj
      portal.backend.grantType=client_credentials
      ## bpn & discovery finder
      bpndiscovery.hostname=https://semantics.txcd.arena2036-x.de/bpndiscovery/api/v1.0
      discovery.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token
      discovery.clientId=sa-cl22-01
      discovery.clientSecret=changeme
      discovery.grantType=client_credentials
      # policy-hub config
      policy.hub.hostname=https://policyhub.txcd.arena2036-x.de/api
      policy.hub.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token
      policy.hub.clientId=satest01
      policy.hub.clientSecret=UbfW4CR1xH4OskkovqJ2JzcwnQIrG7oj
      policy.hub.grantType=client_credentials
      management.endpoints.web.exposure.include=*
      management.endpoint.health.show-details=always
      management.metrics.export.prometheus.enabled=true
      management.endpoint.prometheus.enabled=true
      spring.sleuth.sampler.probability=1.0
      spring.zipkin.base-url=http://localhost:9411/
      spring.zipkin.sender.type=web
      spring.application.name=springboot-monitoring-SDE

frontend:
  image:
    repository: harbor-hub-shared.arena.3ascloud.de/arena2036/managed-simple-data-exchanger-frontend
    pullPolicy: Always
      # Overrides the image tag whose default is the chart appVersion.
    tag: latest
  imagePullSecrets:
    - name: registry-creds
  nameOverride: ""
  fullnameOverride: ""
  portContainer: 8080
  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 101

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  sde:
    endpoints:
        ## Default api exposing health checks etc
      default:
          # -- The network port, which the "default" api is going to be exposed by the container, pod and service
        port: "80"
          # -- The path mapping the "default" api is going to be exposed at
        path: /
  ingresses:
    - enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-origin: "*"
        nginx.ingress.kubernetes.io/enable-cors: "true"
      hostname: "sde.staging.arena2036-x.de"
      endpoints:
        - default
      tls:
        enabled: true
        secretName: "sde-frontend-tls"
          # -- If present overwrites the default secret name
      certManager:
        # -- If preset enables certificate generation via cert-manager namespace scoped issuer
        # issuer: ""
          # -- If preset enables certificate generation via cert-manager cluster-wide issuer
        clusterIssuer: "letsencrypt-staging"

  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 600m
      memory: 2Gi
    requests:
      cpu: 600m
      memory: 2Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  configuration:
    properties: |-
      REACT_APP_API_URL=https://sde-backend.staging.arena2036-x.de/api
      REACT_APP_KEYCLOAK_URL=https://centralidp.staging.arena2036-x.de/auth
      REACT_APP_KEYCLOAK_REALM=CX-Central
      REACT_APP_CLIENT_ID=CX-SDE
      REACT_APP_FILESIZE=104857600
      REACT_APP_DEFAULT_COMPANY_BPN=BPNL000000000065

serviceAccount:
  # Specifies whether a service account should be created
  create: true
    # Annotations to add to the service account
  annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
  name: ""
