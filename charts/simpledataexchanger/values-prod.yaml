# backend for SDE
replicaCount: 1
sdepostgresql:
  # -- PostgreSQL chart configuration
  # Switch to enable or disable the PostgreSQL helm chart
  image:
    # -- PostgreSQL image registry
    registry: docker.io
    # -- PostgreSQL image repository
    repository: postgres
  enabled: true
  fullnameOverride: "product-sde-postgres"
  auth:
    postgresPassword: ""
    username: "sdeuser"
    password: "password"
    database: "sdedb"
    port: 5432
    existingSecret: ""
backend:
  image:
    repository: harbor-hub-shared.arena.3ascloud.de/arena2036/managed-simple-data-exchanger-backend
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: backend-10112026
  imagePullSecrets:
    - name: registry-creds
  nameOverride: ""
  fullnameOverride: ""
  portContainer: 8080
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1001
  service:
    type: ClusterIP
    port: 7070
    targetPort: 8080
  backend:
    endpoints:
      ## Default api exposing health checks etc
      default:
        # -- The network port, which the "default" api is going to be exposed by the container, pod and service
        port: 7070
        # -- The path mapping the "default" api is going to be exposed at
        path: /
        # api:
        #   port: "8080"
        #   path: /api
  ingresses:
    - enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-origin: "https://*tx.test"
        nginx.ingress.kubernetes.io/enable-cors: "true"
      hostname: "sde-backend.prod.arena2036-x.de"
      endpoints:
        - default
      tls:
        enabled: true
        secretName: "sde-backend-tls"
      # -- If present overwrites the default secret name
      certManager:
        # -- If preset enables certificate generation via cert-manager namespace scoped issuer
        # issuer: ""
        # -- If preset enables certificate generation via cert-manager cluster-wide issuer
        clusterIssuer: "letsencrypt-prod"
        # hosts:
        #   - chart-example.local
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 600m
      memory: 2Gi
    requests:
      cpu: 600m
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}
  configuration:
    properties: "keycloak.clientid=SDE-2\nspring.security.oauth2.resourceserver.jwt.issuer-uri=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central\n# Enable multipart uploads\nspring.servlet.multipart.enabled=true\nspring.main.allow-bean-definition-overriding=true\nspring.jackson.mapper.accept-case-insensitive-enums=true\n# Threshold after which files are written to disk.\nspring.servlet.multipart.file-size-threshold=2KB   \n# Max file size.\nspring.servlet.multipart.max-file-size=200MB\n# Max Request Size\nspring.servlet.multipart.max-request-size=215MB\nserver.servlet.context-path=/api\n## Flyway\nspring.flyway.baseline-on-migrate=true\nspring.flyway.locations=classpath:/flyway\n## Database\nspring.datasource.driver-class-name=org.postgresql.Driver\nspring.jpa.hibernate.ddl-auto=update\n#spring.jpa.hibernate.ddl-auto=create\nspring.datasource.url=jdbc:postgresql://localhost:5432/sdedb\nspring.datasource.username=postgres\nspring.datasource.password=admin\nspring.jpa.open-in-view=false\n## File Storage Properties\nfile.upload-dir=./temp/\n## Logging\nlogging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%logger{36}] - %msg%n\nlogging.level.root=DEBUG\nlogging.level.org.springframework.web=WARN\nlogging.level.org.apache.http=DEBUG\nlogging.level.sun.rmi=WARN\nlogging.level.javax.management.remote.rmi=WARN\nlogging.level.com.zaxxer.hikari=WARN\nlogging.level.org.springframework.cloud.openfeign=DEBUG\n#feign.client.config.digitalTwinsFeignClient.loggerLevel=DEBUG\n## Digital Twins\ndigital-twins.hostname=https://connector-2-dtr.txcd.arena2036.app/semantics/registry\ndigital-twins.registry.uri=/api/v3\ndigital-twins.registry.lookup.uri=/api/v3\ndigital-twins.authentication.enable=false\n#digital-twins.authentication.url=https://centralidp.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token\ndigital-twins.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token\ndigital-twins.authentication.clientId=satest01\ndigital-twins.authentication.clientSecret=UbfW4CR1xH4OskkovqJ2JzcwnQIrG7oj\ndigital-twins.authentication.grantType=client_credentials\ndigital-twins.authentication.scope=\n#General EDC Configutation\nedc.version.major=0\nedc.version.minor=11\nedc.version.nano=1\nedc.asset.prop.common.version=3.0\n## EDC Provider\nedc.hostname=https://connector-2-controlplane.txcd.arena2036.app\nedc.managementpath=/management\nedc.apiKeyHeader=X-Api-Key\nedc.apiKey=CONNECTOR2\nedc.dsp.endpointpath=/api/v1/dsp\nedc.dataplane.hostname=https://connector-2-dataplane.txcd.arena2036.app\nedc.dataplane.endpointpath=/api/public\nedc.managementpath.apiversion=/v3\nedc.managementpath.apiversion.asset=/v3\n## needs to be empty because cx-policy context is causing issues\nedc.policy.prefix=https://w3id.org/catenax/2025/9/policy/\n## EDC Consumer\nedc.consumer.hostname=https://connector-3-controlplane.txcd.arena2036.app\nedc.consumer.apikeyheader=X-Api-Key\nedc.consumer.apikey=CONNECTOR3\n##edc.consumer.managementpath=/data/v2\nedc.consumer.managementpath=/management\nedc.consumer.protocol.path=/api/v1/dsp\n## Submodel data source configuration for EDC\n##rename to submodel.datasource.external\nsubmodel.datasource.enable=true\nsubmodel.datasource.hostname=https://connector-2-submodelserver.txcd.arena2036.app\nsubmodel.datasource.authentication.enable=false\nsubmodel.datasource.clientId=sa-cl22-01\nsubmodel.datasource.clientSecret=changeme\nsubmodel.datasource.grantType=client_credentials\n#EDR Configuration\nedr.retry.count=5\nedr.retry.time=1500\nedr.refresh.auto=true\nedr.refresh.enable=false\n## Manufacturer Id\nmanufacturerId=BPNL00000000052O\n##Partner Pool Api Host\npartner.pool.hostname=default\npartner.pool.authentication.url=default\npartner.pool.clientId=default\npartner.pool.clientSecret=default\npartner.pool.grantType=client_credentials\n#BPDM\nbpdm.provider.edc.dsp.api=https://connector-2-controlplane.txcd.arena2036.app\nbpdm.provider.bpnl=BPNL00000000052O\n#bpdm.provider.edc.public.api==\n## Portal backend and Connector discovery\nportal.backend.hostname=https://portal-backend.txcd.arena2036-x.de\nportal.backend.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token\nportal.backend.clientId=satest01\nportal.backend.clientSecret=UbfW4CR1xH4OskkovqJ2JzcwnQIrG7oj\nportal.backend.grantType=client_credentials\n## bpn & discovery finder\nbpndiscovery.hostname=https://semantics.txcd.arena2036-x.de/bpndiscovery/api/v1.0\ndiscovery.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token\ndiscovery.clientId=sa-cl22-01\ndiscovery.clientSecret=changeme\ndiscovery.grantType=client_credentials\n# policy-hub config\npolicy.hub.hostname=https://policyhub.txcd.arena2036-x.de/api\npolicy.hub.authentication.url=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central/protocol/openid-connect/token\npolicy.hub.clientId=satest01\npolicy.hub.clientSecret=UbfW4CR1xH4OskkovqJ2JzcwnQIrG7oj\npolicy.hub.grantType=client_credentials\nmanagement.endpoints.web.exposure.include=*\nmanagement.endpoint.health.show-details=always\nmanagement.metrics.export.prometheus.enabled=true\nmanagement.endpoint.prometheus.enabled=true\nspring.sleuth.sampler.probability=1.0\nspring.zipkin.base-url=http://localhost:9411/\nspring.zipkin.sender.type=web\nspring.application.name=springboot-monitoring-SDE"
frontend:
  image:
    repository: harbor-hub-shared.arena.3ascloud.de/arena2036/managed-simple-data-exchanger-frontend
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: demo-frontend
  imagePullSecrets:
    - name: registry-creds
  nameOverride: ""
  fullnameOverride: ""
  portContainer: 8080
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 101
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  sde:
    endpoints:
      ## Default api exposing health checks etc
      default:
        # -- The network port, which the "default" api is going to be exposed by the container, pod and service
        port: "80"
        # -- The path mapping the "default" api is going to be exposed at
        path: /
  ingresses:
    - enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
        nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-origin: "*"
        nginx.ingress.kubernetes.io/enable-cors: "true"
      hostname: "sde.prod.arena2036-x.de"
      endpoints:
        - default
      tls:
        enabled: true
        secretName: "sde-frontend-tls"
        # -- If present overwrites the default secret name
      certManager:
        # -- If preset enables certificate generation via cert-manager namespace scoped issuer
        # issuer: ""
        # -- If preset enables certificate generation via cert-manager cluster-wide issuer
        clusterIssuer: "letsencrypt-prod"
  resources:
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    limits:
      cpu: 600m
      memory: 2Gi
    requests:
      cpu: 600m
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}
  configuration:
    properties: |-
      REACT_APP_API_URL=https://sde-backend.prod.arena2036-x.de/api
      REACT_APP_KEYCLOAK_URL=https://centralidp.prod.arena2036-x.de/auth
      REACT_APP_KEYCLOAK_REALM=CX-Central
      REACT_APP_CLIENT_ID=CX-SDE
      REACT_APP_FILESIZE=104857600
      REACT_APP_DEFAULT_COMPANY_BPN=BPNL000000000065
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
