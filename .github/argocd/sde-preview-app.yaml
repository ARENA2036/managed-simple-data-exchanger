apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: REPLACE_APPLICATION
  namespace: argocd

  labels:
    app.kubernetes.io/name: sde
    app.kubernetes.io/component: developer-preview
    app.kubernetes.io/managed-by: github-actions

  annotations:
    preview.sde/branch: REPLACE_HELM_BRANCH

spec:
  project: simple-data-exchanger

  source:
    repoURL: https://github.com/ARENA2036/managed-simple-data-exchanger.git
    targetRevision: REPLACE_HELM_BRANCH
    path: charts/simpledataexchanger

    helm:
      releaseName: REPLACE_RELEASE_NAME

      valueFiles:
        - values-dev.yaml

      parameters:
        # Unique resource names
        - name: backend.fullnameOverride
          value: REPLACE_RELEASE_NAME-backend
          forceString: true

        - name: frontend.fullnameOverride
          value: REPLACE_RELEASE_NAME-frontend
          forceString: true

        # Docker image tags
        - name: backend.image.tag
          value: REPLACE_BACKEND_TAG
          forceString: true

        - name: frontend.image.tag
          value: REPLACE_FRONTEND_TAG
          forceString: true

        # Backend ingress
        - name: backend.ingresses[0].enabled
          value: "true"

        - name: backend.ingresses[0].className
          value: nginx
          forceString: true

        - name: backend.ingresses[0].hostname
          value: REPLACE_BACKEND_HOST
          forceString: true

        - name: backend.ingresses[0].tls.enabled
          value: "true"

        - name: backend.ingresses[0].tls.secretName
          value: REPLACE_RELEASE_NAME-backend-tls
          forceString: true

        - name: backend.ingresses[0].certManager.clusterIssuer
          value: letsencrypt-int
          forceString: true

        # Frontend ingress
        - name: frontend.ingresses[0].enabled
          value: "true"

        - name: frontend.ingresses[0].className
          value: nginx
          forceString: true

        - name: frontend.ingresses[0].hostname
          value: REPLACE_FRONTEND_HOST
          forceString: true

        - name: frontend.ingresses[0].tls.enabled
          value: "true"

        - name: frontend.ingresses[0].tls.secretName
          value: REPLACE_RELEASE_NAME-frontend-tls
          forceString: true

        - name: frontend.ingresses[0].certManager.clusterIssuer
          value: letsencrypt-int
          forceString: true

  destination:
    name: arenax-ap6
    namespace: REPLACE_NAMESPACE

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - PruneLast=true

  revisionHistoryLimit: 3