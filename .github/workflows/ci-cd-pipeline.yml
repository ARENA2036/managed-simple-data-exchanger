name: SDE CI-CD Pipeline

# Deployment rules:
#
# Developer Preview:
#   feature/**, feat/**, bugfix/**, hotfix/**, chore/**, docs/**
#   Manual with environment=dev-ap6
#   Cluster: arenax-ap6
#   Values: values-dev.yaml
#
# Shared Development:
#   develop
#   Manual with environment=dev-ap6
#   Cluster: arenax-ap6
#   Values: values-dev.yaml
#
# Staging:
#   develop
#   Manual with environment=staging
#   Cluster: arenax-staging
#   Values: values-staging.yaml
#
# Production:
#   release/**
#   Manual with environment=prod
#   Cluster: arenax-prod
#   Values: values-prod.yaml
#
# This repository does not build Docker images.
# Images must already exist in Harbor.

on:
  repository_dispatch:
    types:
      - sde-deployment-request

  # push:
  #   branches:
  #     - "feature/**"
  #     - "bugfix/**"
  #     - "hotfix/**"
  #     - "chore/**"
  #     - "feat/**"
  #     - "docs/**"
  #     - ci-cd-branch

  workflow_dispatch:
    inputs:
      environment:
        description: "Select the target environment for deployment"
        required: true
        default: dev-ap6
        type: choice
        options:
          - dev-ap6
          - staging
          - prod

      # image_tag:
      #   description: "Optional: New Docker image tag for backend and frontend. Leave empty to use the current Git SHA"
      #   required: false
      #   type: string

      backend_image_tag:
        description: "Backend: Optional existing Docker image tag, e.g. latest-v1"
        required: true
        type: string

      frontend_image_tag:
        description: "Frontend: Optional existing Docker image tag, e.g. latest-v1"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  security-events: write
  id-token: write

  # Required by the current reusable TruffleHog workflow.
  issues: write

concurrency:
  group: sde-deployment-${{ github.event.client_payload.branch || github.ref_name }}
  cancel-in-progress: false

env:
  CHART_PATH: charts/simpledataexchanger

  DEV_VALUES_FILE: charts/simpledataexchanger/values-dev.yaml
  STAGING_VALUES_FILE: charts/simpledataexchanger/values-staging.yaml
  PROD_VALUES_FILE: charts/simpledataexchanger/values-prod.yaml

  BACKEND_IMAGE_REPOSITORY: harbor-hub-shared.arena.3ascloud.de/arena2036/managed-simple-data-exchanger-backend
  FRONTEND_IMAGE_REPOSITORY: harbor-hub-shared.arena.3ascloud.de/arena2036/managed-simple-data-exchanger-frontend

  # Kubeconfig for the cluster hosting Central Argo CD.
  CENTRAL_ARGOCD_VAULT_PATH: staging/infra/cluster-prod

  VAULT_VERSION: "1.21.2"

jobs:
  # =================================================================
  # Scan the Helm repository for secrets.
  # trufflehog.yml must support workflow_call.
  # =================================================================
  trufflehog:
    name: Secret Scan
    uses: ./.github/workflows/trufflehog.yml
    secrets: inherit

  # =================================================================
  # Resolve deployment environment, values file and image tags.
  # =================================================================
  resolve-deployment:
    name: Resolve Deployment
    needs: trufflehog
    runs-on: ubuntu-latest

    outputs:
      deployment_type: ${{ steps.resolve.outputs.deployment_type }}
      values_file: ${{ steps.resolve.outputs.values_file }}
      template_file: ${{ steps.resolve.outputs.template_file }}

      backend_tag: ${{ steps.resolve.outputs.backend_tag }}
      frontend_tag: ${{ steps.resolve.outputs.frontend_tag }}

      target_branch: ${{ steps.resolve.outputs.target_branch }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      application_name: ${{ steps.resolve.outputs.application_name }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      safe_branch: ${{ steps.resolve.outputs.safe_branch }}

    steps:
      - name: Resolve deployment configuration
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            BRANCH_NAME="${{ github.event.client_payload.branch }}"
            DISPATCH_SOURCE="${{ github.event.client_payload.source }}"

            TARGET_ENVIRONMENT="${{ github.event.client_payload.environment }}"
            COMMON_TAG="${{ github.event.client_payload.image_tag }}"
            BACKEND_TAG="${{ github.event.client_payload.backend_image_tag }}"
            FRONTEND_TAG="${{ github.event.client_payload.frontend_image_tag }}"

            # Developer Preview defaults to AP6.
            if [[ -z "$TARGET_ENVIRONMENT" ]]; then
              TARGET_ENVIRONMENT="dev-ap6"
            fi

          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BRANCH_NAME="${{ github.ref_name }}"
            DISPATCH_SOURCE=""

            TARGET_ENVIRONMENT="${{ github.event.inputs.environment }}"
            COMMON_TAG="${{ github.event.inputs.image_tag }}"
            BACKEND_TAG="${{ github.event.inputs.backend_image_tag }}"
            FRONTEND_TAG="${{ github.event.inputs.frontend_image_tag }}"

            # Manual run defaults to the current Helm Git SHA.
            if [[ -z "$COMMON_TAG" ]]; then
              COMMON_TAG="${{ github.sha }}"
            fi

          else
            BRANCH_NAME="${{ github.ref_name }}"
            DISPATCH_SOURCE=""

            TARGET_ENVIRONMENT="dev-ap6"
            COMMON_TAG=""
            BACKEND_TAG=""
            FRONTEND_TAG=""
          fi

          # Component tags override the common image tag.
          if [[ -z "$BACKEND_TAG" ]]; then
            BACKEND_TAG="$COMMON_TAG"
          fi

          if [[ -z "$FRONTEND_TAG" ]]; then
            FRONTEND_TAG="$COMMON_TAG"
          fi

          echo "Event: $EVENT_NAME"
          echo "Application branch: $BRANCH_NAME"
          echo "Dispatch source: $DISPATCH_SOURCE"
          echo "Target environment: $TARGET_ENVIRONMENT"
          echo "Common image tag: $COMMON_TAG"
          echo "Backend image tag: $BACKEND_TAG"
          echo "Frontend image tag: $FRONTEND_TAG"

          # Docker tag:
          # feature/new-ui -> feature-new-ui
          BRANCH_TAG="$(printf '%s' "$BRANCH_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
            | cut -c1-100)"

          # Kubernetes-safe preview identifier.
          DNS_BRANCH="$(printf '%s' "$BRANCH_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9-]#-#g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
            | cut -c1-35)"

          if [[ -z "$BRANCH_TAG" || -z "$DNS_BRANCH" ]]; then
            echo "Could not generate safe branch identifiers"
            exit 1
          fi

          BRANCH_HASH="$(printf '%s' "$BRANCH_NAME" \
            | sha256sum \
            | cut -c1-7)"

          SAFE_BRANCH="${DNS_BRANCH}-${BRANCH_HASH}"

          # ---------------------------------------------------------
          # Manual developer preview.
          #
          # Starts from:
          #   - repository_dispatch sent by a manual frontend/backend run
          #   - workflow_dispatch started manually in this Helm repository
          # ---------------------------------------------------------
          if [[
                (
                  "$EVENT_NAME" == "repository_dispatch" &&
                  "$TARGET_ENVIRONMENT" == "dev-ap6"
                ) ||
                (
                  "$EVENT_NAME" == "workflow_dispatch" &&
                  "$TARGET_ENVIRONMENT" == "dev-ap6" &&
                  "$BRANCH_NAME" != "develop"
                )
              ]]; then

            if [[ "$BRANCH_NAME" != "ci-cd-branch" &&
                  "$BRANCH_NAME" != feature/* &&
                  "$BRANCH_NAME" != feat/* &&
                  "$BRANCH_NAME" != bugfix/* &&
                  "$BRANCH_NAME" != hotfix/* &&
                  "$BRANCH_NAME" != chore/* &&
                  "$BRANCH_NAME" != docs/* ]]; then

              echo "Developer Preview is not allowed from: $BRANCH_NAME"
              exit 1
            fi

            DEPLOYMENT_TYPE="preview"
            VALUES_FILE="$DEV_VALUES_FILE"
            TEMPLATE_FILE=".github/argocd/sde-preview-app.yaml"

            if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
              # Use the Helm CI/CD testing branch for dispatched preview runs.
              TARGET_BRANCH="ci-cd-branch"
            else
              # Direct manual Helm run uses the selected Helm branch.
              TARGET_BRANCH="$BRANCH_NAME"
            fi

            APPLICATION_NAME="sde-${SAFE_BRANCH}"
            RELEASE_NAME="sde-${SAFE_BRANCH}"
            NAMESPACE="sde-${SAFE_BRANCH}"

          # ---------------------------------------------------------
          # Manual shared development deployment.
          # ---------------------------------------------------------
          elif [[ "$EVENT_NAME" == "workflow_dispatch" &&
                  "$TARGET_ENVIRONMENT" == "dev-ap6" &&
                  "$BRANCH_NAME" == "develop" ]]; then

            DEPLOYMENT_TYPE="shared-dev"
            VALUES_FILE="$DEV_VALUES_FILE"
            TEMPLATE_FILE=".github/argocd/sde-dev-app.yaml"

            if [[ -z "$BACKEND_TAG" ]]; then
              BACKEND_TAG="develop"
            fi

            if [[ -z "$FRONTEND_TAG" ]]; then
              FRONTEND_TAG="develop"
            fi

            TARGET_BRANCH="develop"
            APPLICATION_NAME="sde-application-ap6"
            RELEASE_NAME="sde"
            NAMESPACE="simple-data-exchanger"

          # ---------------------------------------------------------
          # Manual staging deployment.
          # ---------------------------------------------------------
          elif [[ "$EVENT_NAME" == "workflow_dispatch" &&
                  "$TARGET_ENVIRONMENT" == "staging" &&
                  "$BRANCH_NAME" == "develop" ]]; then

            DEPLOYMENT_TYPE="staging"
            VALUES_FILE="$STAGING_VALUES_FILE"
            TEMPLATE_FILE=".github/argocd/sde-staging-app.yaml"

            if [[ -z "$BACKEND_TAG" ]]; then
              BACKEND_TAG="develop"
            fi

            if [[ -z "$FRONTEND_TAG" ]]; then
              FRONTEND_TAG="develop"
            fi

            TARGET_BRANCH="develop"
            APPLICATION_NAME="sde-application-staging"
            RELEASE_NAME="sde"
            NAMESPACE="simple-data-exchanger"

          # ---------------------------------------------------------
          # Manual production deployment.
          # ---------------------------------------------------------
          elif [[ "$EVENT_NAME" == "workflow_dispatch" &&
                  "$TARGET_ENVIRONMENT" == "prod" &&
                  "$BRANCH_NAME" == release/* ]]; then

            DEPLOYMENT_TYPE="production"
            VALUES_FILE="$PROD_VALUES_FILE"
            TEMPLATE_FILE=".github/argocd/sde-prod-app.yaml"

            # Do not use the Helm repository SHA as an image tag.
            if [[ -z "$BACKEND_TAG" || -z "$FRONTEND_TAG" ]]; then
              echo "Production requires existing image tags"
              echo
              echo "Provide a common image_tag or both:"
              echo "  backend_image_tag"
              echo "  frontend_image_tag"
              exit 1
            fi

            TARGET_BRANCH="$BRANCH_NAME"
            APPLICATION_NAME="sde-application-prod"
            RELEASE_NAME="sde"
            NAMESPACE="simple-data-exchanger"

          else
            echo "Invalid branch/environment combination"
            echo
            echo "Allowed deployments:"
            echo "  manual dev-ap6 from feature/**, feat/**, bugfix/**, hotfix/**, chore/**, docs/** or ci-cd-branch"
            echo "  develop + dev-ap6"
            echo "  develop + staging"
            echo "  release/** + prod"
            exit 1
          fi

          if [[ -z "$BACKEND_TAG" || -z "$FRONTEND_TAG" ]]; then
            echo "Unable to resolve backend or frontend image tag"
            echo "Common tag: $COMMON_TAG"
            echo "Backend tag: $BACKEND_TAG"
            echo "Frontend tag: $FRONTEND_TAG"
            exit 1
          fi

          {
            echo "deployment_type=$DEPLOYMENT_TYPE"
            echo "values_file=$VALUES_FILE"
            echo "template_file=$TEMPLATE_FILE"

            echo "backend_tag=$BACKEND_TAG"
            echo "frontend_tag=$FRONTEND_TAG"

            echo "target_branch=$TARGET_BRANCH"
            echo "source_branch=$BRANCH_NAME"
            echo "application_name=$APPLICATION_NAME"
            echo "release_name=$RELEASE_NAME"
            echo "namespace=$NAMESPACE"
            echo "safe_branch=$SAFE_BRANCH"
          } >> "$GITHUB_OUTPUT"

          echo "Deployment: $DEPLOYMENT_TYPE"
          echo "Values file: $VALUES_FILE"
          echo "Backend: $BACKEND_IMAGE_REPOSITORY:$BACKEND_TAG"
          echo "Frontend: $FRONTEND_IMAGE_REPOSITORY:$FRONTEND_TAG"

  # =================================================================
  # Verify the selected backend and frontend images exist in Harbor.
  # No Docker image is built here.
  # =================================================================
  verify-images:
    name: Verify Existing Harbor Images
    needs: resolve-deployment
    runs-on: ubuntu-latest

    outputs:
      backend_found: ${{ steps.verify.outputs.backend_found }}
      frontend_found: ${{ steps.verify.outputs.frontend_found }}

    steps:
      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y skopeo

          skopeo --version

      # Behavior:
      # - backend only found  -> continue
      # - frontend only found -> continue
      # - both found          -> continue
      # - neither found       -> stop
      - name: Verify backend and frontend images
        id: verify
        env:
          HBR_USERNAME: ${{ secrets.HBR_USERNAME }}
          HBR_PASSWORD: ${{ secrets.HBR_PASSWORD }}

          BACKEND_TAG: ${{ needs.resolve-deployment.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.resolve-deployment.outputs.frontend_tag }}

        shell: bash
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${BACKEND_IMAGE_REPOSITORY}:${BACKEND_TAG}"
          FRONTEND_IMAGE="${FRONTEND_IMAGE_REPOSITORY}:${FRONTEND_TAG}"

          if [[ -z "$HBR_USERNAME" || -z "$HBR_PASSWORD" ]]; then
            echo "Harbor credentials are missing"
            exit 1
          fi

          if [[ -z "$BACKEND_TAG" || -z "$FRONTEND_TAG" ]]; then
            echo "Backend or frontend image tag is empty"
            exit 1
          fi

          echo "Backend image: $BACKEND_IMAGE"
          echo "Frontend image: $FRONTEND_IMAGE"

          BACKEND_FOUND="false"
          FRONTEND_FOUND="false"

          if skopeo inspect \
            --creds "${HBR_USERNAME}:${HBR_PASSWORD}" \
            "docker://${BACKEND_IMAGE}" \
            > /tmp/backend-inspect.json \
            2> /tmp/backend-error.log; then

            BACKEND_FOUND="true"
          fi

          if skopeo inspect \
            --creds "${HBR_USERNAME}:${HBR_PASSWORD}" \
            "docker://${FRONTEND_IMAGE}" \
            > /tmp/frontend-inspect.json \
            2> /tmp/frontend-error.log; then

            FRONTEND_FOUND="true"
          fi

          echo "Backend found: ${BACKEND_FOUND}"
          echo "Frontend found: ${FRONTEND_FOUND}"

          echo "backend_found=$BACKEND_FOUND" >> "$GITHUB_OUTPUT"
          echo "frontend_found=$FRONTEND_FOUND" >> "$GITHUB_OUTPUT"

          if [[ "$BACKEND_FOUND" != "true" &&
                "$FRONTEND_FOUND" != "true" ]]; then

            echo "Neither backend nor frontend image exists"
            echo "Backend: $BACKEND_IMAGE"
            echo "Frontend: $FRONTEND_IMAGE"

            echo "Backend inspection error:"
            cat /tmp/backend-error.log || true

            echo "Frontend inspection error:"
            cat /tmp/frontend-error.log || true

            exit 1
          fi

          if [[ "$BACKEND_FOUND" == "true" &&
                "$FRONTEND_FOUND" == "true" ]]; then
            echo "Deployment will update backend and frontend"
          elif [[ "$BACKEND_FOUND" == "true" ]]; then
            echo "Deployment will update backend only"
            echo "Frontend will keep its current values-file tag"
          else
            echo "Deployment will update frontend only"
            echo "Backend will keep its current values-file tag"
          fi

      - name: Write image summary
        env:
          BACKEND_FOUND: ${{ steps.verify.outputs.backend_found }}
          FRONTEND_FOUND: ${{ steps.verify.outputs.frontend_found }}

        shell: bash
        run: |
          {
            echo "## SDE Harbor image verification"
            echo
            echo "| Component | Image | Found |"
            echo "|---|---|---|"
            echo "| Backend | `${BACKEND_IMAGE_REPOSITORY}:${{ needs.resolve-deployment.outputs.backend_tag }}` | `${BACKEND_FOUND}` |"
            echo "| Frontend | `${FRONTEND_IMAGE_REPOSITORY}:${{ needs.resolve-deployment.outputs.frontend_tag }}` | `${FRONTEND_FOUND}` |"
          } >> "$GITHUB_STEP_SUMMARY"

  update-image-tag:
    name: Update Helm Image Tags for Deployment
    needs:
      - resolve-deployment
      - verify-images

    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      backend_tag: ${{ steps.update.outputs.backend_tag }}
      frontend_tag: ${{ steps.update.outputs.frontend_tag }}

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deployment.outputs.target_branch }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update available backend and frontend image tags
        id: update
        env:
          VALUES_FILE: ${{ needs.resolve-deployment.outputs.values_file }}

          REQUESTED_BACKEND_TAG: ${{ needs.resolve-deployment.outputs.backend_tag }}
          REQUESTED_FRONTEND_TAG: ${{ needs.resolve-deployment.outputs.frontend_tag }}

          BACKEND_FOUND: ${{ needs.verify-images.outputs.backend_found }}
          FRONTEND_FOUND: ${{ needs.verify-images.outputs.frontend_found }}

        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "Values file not found: $VALUES_FILE"
            exit 1
          fi

          CURRENT_BACKEND_TAG="$(yq -r '.backend.image.tag // ""' "$VALUES_FILE")"
          CURRENT_FRONTEND_TAG="$(yq -r '.frontend.image.tag // ""' "$VALUES_FILE")"

          EFFECTIVE_BACKEND_TAG="$CURRENT_BACKEND_TAG"
          EFFECTIVE_FRONTEND_TAG="$CURRENT_FRONTEND_TAG"

          if [[ "$BACKEND_FOUND" == "true" ]]; then
            EFFECTIVE_BACKEND_TAG="$REQUESTED_BACKEND_TAG"

            yq -i \
              '.backend.image.repository = strenv(BACKEND_IMAGE_REPOSITORY)' \
              "$VALUES_FILE"

            BACKEND_TAG="$EFFECTIVE_BACKEND_TAG" \
              yq -i '.backend.image.tag = strenv(BACKEND_TAG)' "$VALUES_FILE"

            echo "Backend updated to: $EFFECTIVE_BACKEND_TAG"
          else
            echo "Backend image was not found"
            echo "Keeping backend tag: $EFFECTIVE_BACKEND_TAG"
          fi

          if [[ "$FRONTEND_FOUND" == "true" ]]; then
            EFFECTIVE_FRONTEND_TAG="$REQUESTED_FRONTEND_TAG"

            yq -i \
              '.frontend.image.repository = strenv(FRONTEND_IMAGE_REPOSITORY)' \
              "$VALUES_FILE"

            FRONTEND_TAG="$EFFECTIVE_FRONTEND_TAG" \
              yq -i '.frontend.image.tag = strenv(FRONTEND_TAG)' "$VALUES_FILE"

            echo "Frontend updated to: $EFFECTIVE_FRONTEND_TAG"
          else
            echo "Frontend image was not found"
            echo "Keeping frontend tag: $EFFECTIVE_FRONTEND_TAG"
          fi

          if [[ -z "$EFFECTIVE_BACKEND_TAG" || -z "$EFFECTIVE_FRONTEND_TAG" ]]; then
            echo "Effective backend or frontend tag is empty"
            exit 1
          fi

          echo "backend_tag=$EFFECTIVE_BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$EFFECTIVE_FRONTEND_TAG" >> "$GITHUB_OUTPUT"

          echo "Updated Helm values:"
          git diff -- "$VALUES_FILE"

      - name: Validate Helm values
        env:
          VALUES_FILE: ${{ needs.resolve-deployment.outputs.values_file }}
          TARGET_NAMESPACE: ${{ needs.resolve-deployment.outputs.namespace }}

        shell: bash
        run: |
          set -euo pipefail

          helm dependency update "$CHART_PATH"

          helm lint \
            "$CHART_PATH" \
            --with-subcharts \
            --values "$VALUES_FILE"

          helm template sde \
            "$CHART_PATH" \
            --namespace "$TARGET_NAMESPACE" \
            --values "$VALUES_FILE" \
            > /tmp/sde-rendered.yaml

          test -s /tmp/sde-rendered.yaml

      - name: Commit updated Helm values
        env:
          VALUES_FILE: ${{ needs.resolve-deployment.outputs.values_file }}
          BACKEND_TAG: ${{ steps.update.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.update.outputs.frontend_tag }}
          TARGET_BRANCH: ${{ needs.resolve-deployment.outputs.target_branch }}

        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f "$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No Helm values changes to commit"
            exit 0
          fi

          git commit \
            -m "chore: update SDE image tags [skip ci]"

          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:${TARGET_BRANCH}"

  # =================================================================
  # Create Harbor image pull secret in the target application cluster.
  # =================================================================
  create-registry-secret:
    name: Create Harbor Registry Secret
    needs:
      - resolve-deployment
      - update-image-tag

    runs-on: ubuntu-latest

    steps:
      - name: Install kubectl and Vault
        shell: bash
        run: |
          set -euo pipefail

          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"

          curl -LO -s \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl -sSL \
            "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" \
            -o vault.zip

          unzip -q vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/vault

      - name: Connect to target cluster
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR_PROD }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN_PROD }}
          DEPLOYMENT_TYPE: ${{ needs.resolve-deployment.outputs.deployment_type }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOYMENT_TYPE" in
            preview|shared-dev)
              VAULT_SECRET_PATH="staging/infra/cluster-int"
              ;;
            staging)
              VAULT_SECRET_PATH="staging/infra/cluster-staging"
              ;;
            production)
              VAULT_SECRET_PATH="staging/infra/cluster-prod"
              ;;
            *)
              echo "Unsupported deployment type: $DEPLOYMENT_TYPE"
              exit 1
              ;;
          esac

          mkdir -p "$HOME/.kube"

          vault kv get \
            -field=config \
            "$VAULT_SECRET_PATH" \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          kubectl config current-context
          kubectl cluster-info

      - name: Create Harbor registry secret
        env:
          HBR_USERNAME: ${{ secrets.HBR_USERNAME }}
          HBR_PASSWORD: ${{ secrets.HBR_PASSWORD }}
          TARGET_NAMESPACE: ${{ needs.resolve-deployment.outputs.namespace }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$HBR_USERNAME" || -z "$HBR_PASSWORD" ]]; then
            echo "HBR_USERNAME or HBR_PASSWORD is missing"
            exit 1
          fi

          if [[ -z "$TARGET_NAMESPACE" ]]; then
            echo "Target namespace is empty"
            exit 1
          fi

          kubectl create namespace "$TARGET_NAMESPACE" \
            --dry-run=client \
            -o yaml |
          kubectl apply -f -

          kubectl create secret docker-registry registry-creds \
            --docker-server="harbor-hub-shared.arena.3ascloud.de" \
            --docker-username="$HBR_USERNAME" \
            --docker-password="$HBR_PASSWORD" \
            --namespace="$TARGET_NAMESPACE" \
            --dry-run=client \
            -o yaml |
          kubectl apply -f -

          kubectl get secret registry-creds \
            --namespace="$TARGET_NAMESPACE"

  deploy-preview:
    name: Deploy Developer Preview
    needs:
      - resolve-deployment
      - update-image-tag
      - create-registry-secret

    if: |
      needs.resolve-deployment.outputs.deployment_type == 'preview'

    runs-on: ubuntu-latest
    environment: sde-preview

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-deployment.outputs.target_branch }}
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"

          curl -LO -s \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq

          curl -sSL \
            "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" \
            -o vault.zip

          unzip -q vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/vault

      - name: Connect to Central Argo CD cluster
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"

          export VAULT_ADDR="${{ secrets.VAULT_ADDR_PROD }}"
          export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_PROD }}"

          vault kv get \
            -field=config \
            "$CENTRAL_ARGOCD_VAULT_PATH" \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          CONTEXT="$(yq e '.current-context' "$HOME/.kube/config")"

          if [[ -z "$CONTEXT" || "$CONTEXT" == "null" ]]; then
            echo "Central Argo CD context was not found"
            exit 1
          fi

          kubectl --context="$CONTEXT" cluster-info
          echo "ARGOCD_KUBE_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"

      - name: Generate preview Argo CD Application
        env:
          TEMPLATE_FILE: ${{ needs.resolve-deployment.outputs.template_file }}
          APPLICATION_NAME: ${{ needs.resolve-deployment.outputs.application_name }}
          RELEASE_NAME: ${{ needs.resolve-deployment.outputs.release_name }}
          TARGET_BRANCH: ${{ needs.resolve-deployment.outputs.target_branch }}
          SOURCE_BRANCH: ${{ needs.resolve-deployment.outputs.source_branch }}
          TARGET_NAMESPACE: ${{ needs.resolve-deployment.outputs.namespace }}
          BACKEND_TAG: ${{ needs.update-image-tag.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.update-image-tag.outputs.frontend_tag }}

        shell: bash
        run: |
          set -euo pipefail

          GENERATED="/tmp/sde-preview-app.yaml"

          cp "$TEMPLATE_FILE" "$GENERATED"

          sed -i "s|REPLACE_APPLICATION|${APPLICATION_NAME}|g" "$GENERATED"
          sed -i "s|REPLACE_BRANCH_NAME|${SOURCE_BRANCH}|g" "$GENERATED"
          sed -i "s|REPLACE_HELM_BRANCH|${TARGET_BRANCH}|g" "$GENERATED"
          sed -i "s|REPLACE_RELEASE_NAME|${RELEASE_NAME}|g" "$GENERATED"
          sed -i "s|REPLACE_BACKEND_TAG|${BACKEND_TAG}|g" "$GENERATED"
          sed -i "s|REPLACE_FRONTEND_TAG|${FRONTEND_TAG}|g" "$GENERATED"
          sed -i "s|REPLACE_NAMESPACE|${TARGET_NAMESPACE}|g" "$GENERATED"

          if grep -q 'REPLACE_' "$GENERATED"; then
            echo "Unresolved placeholders:"
            grep 'REPLACE_' "$GENERATED"
            exit 1
          fi

          kubectl apply \
            --dry-run=client \
            --validate=false \
            -f "$GENERATED"

          cat "$GENERATED"

      - name: Apply preview Application
        shell: bash
        run: |
          set -euo pipefail

          kubectl \
            --context="$ARGOCD_KUBE_CONTEXT" \
            apply \
            -f /tmp/sde-preview-app.yaml

          kubectl \
            --context="$ARGOCD_KUBE_CONTEXT" \
            get application \
            "${{ needs.resolve-deployment.outputs.application_name }}" \
            -n argocd

